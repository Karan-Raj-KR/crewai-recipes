version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/recipes/*"
      - "/playground"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    ignore:
      # crewai pins these ranges itself. Raising our floor past crewai's
      # range makes requirements unresolvable (ResolutionImpossible in
      # #212 and #220), so let crewai upgrades move them instead.
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Pillow 13 requires Python >=3.11, but CI still tests 3.10 (#220).
      # Drop this once Python 3.10 support is removed.
      - dependency-name: "Pillow"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
