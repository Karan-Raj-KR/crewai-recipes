name: CI — Lint & Import Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: pure stdlib, no installs. Catches a malformed recipe in seconds
  # instead of after an eight-way crewai install.
  contract:
    name: Recipe Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest tests/test_recipe_contract.py -v

  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # CrewAI requires Python >=3.10,<3.14. Pin to 3.12 for CI.
          python-version: "3.12"

      # Pinned: an unpinned `ruff` lets a new upstream release change default
      # lint rules and fail every open PR at once, unrelated to their diffs
      # (see #112). Bump deliberately, verified against recipes/ first.
      - name: Install Ruff
        run: pip install "ruff==0.15.10"

      # Whole tree, so a new recipe is covered without editing this file (#167).
      # A scaffold with intentional TODO stubs gets a per-directory exclude here.
      - run: ruff check recipes/ playground/ tools/ tests/
      - run: ruff format --check recipes/ playground/ tools/ tests/

  # Emit the recipe list so import checks cover recipes added later without
  # anyone hand-copying a job into this file.
  discover:
    name: Discover Recipes
    runs-on: ubuntu-latest
    outputs:
      recipes: ${{ steps.list.outputs.recipes }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          names = sorted(
              d.name for d in pathlib.Path("recipes").iterdir()
              if d.is_dir() and not d.name.startswith("_") and (d / "crew.py").exists()
          )
          assert names, "no recipes discovered"
          print(f"recipes={json.dumps(names)}")
          PY

  import-check:
    name: Import Check — ${{ matrix.recipe }} (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint, contract, discover]
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.discover.outputs.recipes) }}
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: recipes/${{ matrix.recipe }}/requirements.txt

      - name: Install recipe dependencies
        run: pip install -r recipes/${{ matrix.recipe }}/requirements.txt

      - name: Install test dependencies
        run: pip install pytest pytest-mock

      # A dummy key proves the wiring imports without ever calling an LLM.
      - name: Verify the crew assembles
        env:
          LLM_API_KEY: test-key
        working-directory: recipes/${{ matrix.recipe }}
        run: |
          python -c "
          import inspect
          from crew import build_crew
          assert callable(build_crew), 'build_crew is not callable'
          print('✅ ${{ matrix.recipe }}:', inspect.signature(build_crew))
          "

      - name: Run tests with pytest
        env:
          LLM_API_KEY: test-key
        working-directory: recipes/${{ matrix.recipe }}
        run: pytest -v

  import-check-playground:
    name: Import Check — playground (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint, contract]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: playground/requirements.txt

      - run: pip install -r playground/requirements.txt
      - run: pip install pytest pytest-mock httpx

      - name: Verify FastAPI app imports and starts
        env:
          LLM_API_KEY: test-key
        working-directory: playground
        run: |
          python -c "
          from main import app
          assert app.title == 'CrewAI Recipes Playground'
          print('✅ playground: FastAPI app imports and initializes OK')
          "

      - name: Run tests with pytest
        env:
          LLM_API_KEY: test-key
        working-directory: playground
        run: pytest -v

  # The gallery is the playground UI plus a fetch shim; if the shim breaks, the
  # deployed site silently shows nothing.
  gallery:
    name: Gallery Shim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: node site/test_static_shim.mjs
      - name: Build the gallery
        run: python tools/build_site.py
