name: CI — Lint & Import Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # CrewAI requires Python >=3.10,<3.14. Pin to 3.12 for CI.
          python-version: "3.12"

      # Pinned: an unpinned `ruff` lets a new upstream release change default
      # lint rules and fail every open PR at once, unrelated to their diffs
      # (see #112). Bump deliberately, verified against recipes/ first.
      - name: Install Ruff
        run: pip install "ruff==0.15.10"

      # Lint only the stable recipes. The scaffolds intentionally contain
      # TODO stubs (unused imports/vars) and are excluded until implemented.
      - name: Run Ruff check
        run: ruff check recipes/lead-qualification/ recipes/faq-bot/ recipes/appointment-booking/ recipes/customer-onboarding/ recipes/whatsapp-action-sim/ recipes/email-drafting/ recipes/support-escalation/ recipes/content-pipeline/

      - name: Run Ruff format check
        run: ruff format --check recipes/lead-qualification/ recipes/faq-bot/ recipes/appointment-booking/ recipes/customer-onboarding/ recipes/whatsapp-action-sim/ recipes/email-drafting/ recipes/support-escalation/ recipes/content-pipeline/

  import-check-lead-qualification:
    name: Import Check — lead-qualification
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install this recipe's dependencies
        run: pip install -r recipes/lead-qualification/requirements.txt

      - name: Install test dependencies
        run: pip install pytest pytest-mock

      - name: Check imports + LLM wiring (no API call)
        env:
          # Dummy key so the module-level EnvironmentError isn't triggered.
          # Constructing the LLM does NOT hit the network — no real call is made.
          LLM_API_KEY: nvapi-test
        run: |
          cd recipes/lead-qualification
          python -c "
          from tasks import build_tasks
          from crew import build_crew
          from llm import get_llm, MAX_RETRIES
          llm = get_llm()
          assert 'llama-3.1-8b-instruct' in llm.model, f'unexpected default model: {llm.model}'
          # Assert retries reach the underlying SDK client, not just the config
          # object — a provider-routing change once silently dropped them.
          retries = llm._get_client_params()['max_retries']
          assert retries == MAX_RETRIES, f'retries not wired to client: {retries}'
          print(f'✅ lead-qualification: imports + LLM wiring OK ({retries} retries)')
          "

      - name: Run tests with pytest
        env:
          LLM_API_KEY: nvapi-test
        run: |
          cd recipes/lead-qualification
          pytest -v

  import-check-faq-bot:
    name: Import Check — faq-bot
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install this recipe's dependencies
        run: pip install -r recipes/faq-bot/requirements.txt

      - name: Install test dependencies
        run: pip install pytest pytest-mock

      - name: Check knowledge base + LLM wiring (no API call)
        env:
          LLM_API_KEY: nvapi-test
        run: |
          cd recipes/faq-bot
          python -c "
          from knowledge_base import FAQ_KNOWLEDGE_BASE, get_knowledge_base_text
          from llm import get_llm, MAX_RETRIES
          assert len(FAQ_KNOWLEDGE_BASE) >= 6, 'Expected at least 6 FAQ entries'
          kb_text = get_knowledge_base_text()
          assert 'PRICING' in kb_text, 'Expected PRICING topic in KB text'
          llm = get_llm()
          # Assert retries reach the underlying SDK client, not just the config
          # object — a provider-routing change once silently dropped them.
          retries = llm._get_client_params()['max_retries']
          assert retries == MAX_RETRIES, f'retries not wired to client: {retries}'
          print(f'✅ faq-bot: {len(FAQ_KNOWLEDGE_BASE)} KB entries + LLM wiring OK ({retries} retries)')
          "

      - name: Run tests with pytest
        env:
          LLM_API_KEY: nvapi-test
        run: |
          cd recipes/faq-bot
          pytest -v

